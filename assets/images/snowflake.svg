    <use href="#flake" transform="translate(292 94) scale(1.2) rotate(-8)"/>
    <use href="#flake" transform="translate(103 156) scale(1.05) rotate(18)"/>
    <use href="#flake" transform="translate(239 218) scale(1.55) rotate(-12)"/>
    <use href="#flake" transform="translate(43 278) scale(.78) rotate(35)"/>
    <use href="#flake" transform="translate(163 344) scale(1.15) rotate(7)"/>
    <use href="#flake" transform="translate(316 366) scale(.86) rotate(23)"/>
  </g>
</svg>
