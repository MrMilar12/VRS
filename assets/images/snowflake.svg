<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420">
  <defs>
    <filter id="soft-shadow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".7" result="blur"/>
      <feOffset dy=".8" result="offset"/>
      <feFlood flood-color="#344b49" flood-opacity=".28" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <g id="flake" fill="none" stroke="#9fb8bb" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" filter="url(#soft-shadow)">
      <path d="M0 0v-13m0 5-4-4m4 4 4-4m-4-4-3 3m3-3 3 3"/>
      <path d="M0 0v-13m0 5-4-4m4 4 4-4m-4-4-3 3m3-3 3 3" transform="rotate(60)"/>
      <path d="M0 0v-13m0 5-4-4m4 4 4-4m-4-4-3 3m3-3 3 3" transform="rotate(120)"/>
      <path d="M0 0v-13m0 5-4-4m4 4 4-4m-4-4-3 3m3-3 3 3" transform="rotate(180)"/>
      <path d="M0 0v-13m0 5-4-4m4 4 4-4m-4-4-3 3m3-3 3 3" transform="rotate(240)"/>
      <path d="M0 0v-13m0 5-4-4m4 4 4-4m-4-4-3 3m3-3 3 3" transform="rotate(300)"/>
      <circle r="1.3" fill="#9fb8bb" stroke="none"/>
    </g>
  </defs>
  <g opacity=".82">
    <use href="#flake" transform="translate(36 46) scale(1.45) rotate(12)"/>
